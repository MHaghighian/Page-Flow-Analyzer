<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOM Hacker</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <div class="chrome">
    <header>
      <div class="title-row">
        <h1>DOM Hacker</h1>
        <span class="pill">v4</span>
      </div>
      <p class="sub" id="pageMeta">Pin a tab, then hard-refresh.</p>
    </header>

    <div class="controls">
      <div class="scope-bar">
        <span class="scope-label">Collect</span>
        <div class="scope-seg" id="scopeSeg">
          <button type="button" data-mode="tab">This tab</button>
          <button type="button" data-mode="origin">This origin</button>
          <button type="button" data-mode="all">All</button>
        </div>
        <button type="button" id="btnHunt" class="hunt">Hunt</button>
      </div>
      <div class="toolbar">
        <button id="btnRefresh" class="primary">Refresh</button>
        <button id="btnPick">Pick</button>
        <button id="btnExport">Export</button>
        <button id="btnClear" class="danger">Clear</button>
      </div>
      <p class="scope-meta" id="scopeMeta"></p>
    </div>

    <div class="tab-search">
      <div class="tabs" id="tabs"></div>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Filter…" autocomplete="off" />
        <span class="match" id="matchCount"></span>
      </div>
    </div>
    <div class="status" id="status">Open a page, pin This tab, hard-refresh.</div>
  </div>

  <main id="body"></main>
  <script src="sidepanel.js" type="module"></script>
</body>
</html>
