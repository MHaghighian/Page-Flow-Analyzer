<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PFA</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Page Flow Analyzer v3</h1>
    <p class="sub" id="pageMeta">AUTO source→sink · English panel on the right</p>
  </header>
  <div class="actions">
    <button id="btnPanel" class="primary">Show / focus page panel</button>
    <button id="btnExport">Export JSON</button>
    <button id="btnClear" class="danger">Clear</button>
  </div>
  <section id="status" class="card ok">Panel auto-refreshes. Values are harvested automatically (URL, storage, network, inputs…). Pick is optional.</section>
  <section class="card"><h2>Counters</h2><div class="grid" id="counts"></div></section>
  <section class="card"><h2>Watches</h2><div id="watches" class="list"></div></section>
  <section class="card"><h2>Host flows</h2><div id="flows" class="list"></div></section>
  <script src="popup.js" type="module"></script>
</body>
</html>
