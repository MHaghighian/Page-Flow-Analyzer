<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DOM Hacker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>DOM Hacker</h1>
    <p class="sub" id="pageMeta">Pin a tab, Hunt, then hard-refresh.</p>
  </header>
  <div class="actions">
    <button id="btnPanel" class="primary">Open side panel</button>
    <button id="btnHunt" class="hunt">Hunt</button>
    <button id="btnExport">Export</button>
    <button id="btnClear" class="danger">Clear</button>
  </div>
  <section id="scope" class="card">Collect: —</section>
  <section id="status" class="card ok">Work happens in the side panel.</section>
  <section class="card"><h2>Counts</h2><div class="grid" id="counts"></div></section>
  <script src="popup.js" type="module"></script>
</body>
</html>
